<!doctype html>
<html lang="te" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Telugu panchangam and jyotisham, on your phone." />
    <meta name="theme-color" content="#c8102e" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>AstroZ</title>
    <style>
      /* First paint before the app's JavaScript arrives: a static shell in the app's own colours (tokens.css). */
      body { margin: 0; background: #fff8ee; color: #2b1d14; }
      .boot { font-family: system-ui, sans-serif; padding: 12px 16px; }
      .boot-brand { font-size: 22px; line-height: 1.3; color: #c8102e; margin: 0 0 20px; }
      .boot-title { font-size: 32px; line-height: 1.4; margin: 0 0 8px; font-weight: 400; }
      .boot-sub { font-size: 16px; line-height: 1.6; color: #6b5848; margin: 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1410; color: #f4eadf; }
        .boot-brand { color: #f27a7d; }
        .boot-sub { color: #b9a898; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <p class="boot-brand">ఆస్ట్రోజ్ · AstroZ</p>
        <h1 class="boot-title">నేటి పంచాంగం</h1>
        <p class="boot-sub">లెక్కిస్తోంది… · Loading…</p>
      </div>
    </div>
    <noscript>AstroZ needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
