<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--az-bg:#fff8ee;--az-surface:#ffffff;--az-surface-sunk:#f7ebda;--az-ink:#2b1d14;--az-ink-muted:#6b5848;--az-line:#eadbc6;--az-line-strong:#8f7862;--az-kumkum:#c8102e;--az-on-kumkum:#ffffff;--az-kumkum-ink:#c8102e;--az-kumkum-soft:#fbe4e4;--az-turmeric:#f2b705;--az-on-turmeric:#2b1d14;--az-turmeric-soft:#fdf0c4;--az-leaf:#2e7d32;--az-on-leaf:#ffffff;--az-leaf-ink:#256b29;--az-leaf-soft:#e6f2e3;--az-caution:#e07a1f;--az-on-caution:#2b1d14;--az-caution-ink:#9a4a0c;--az-caution-soft:#fcebd9;--az-avoid:#8e1b1b;--az-on-avoid:#ffffff;--az-avoid-ink:#8e1b1b;--az-avoid-soft:#f8e1de;--az-gold:#b8860b;--az-gold-soft:#f1e2bd;--az-thoranam:#2e7d32;--az-focus:#c8102e;--az-scrim:#2b1d147a;--az-shadow-card:0 1px 2px rgba(43, 29, 20, 0.06), 0 4px 12px rgba(43, 29, 20, 0.08);--az-space-1:4px;--az-space-2:8px;--az-space-3:12px;--az-space-4:16px;--az-space-5:20px;--az-space-6:24px;--az-space-8:32px;--az-space-12:48px;--az-radius-sm:8px;--az-radius-md:12px;--az-radius-card:16px;--az-radius-pill:999px;--az-touch:48px;--az-icon:24px;--az-screen:390px;--az-elder-scale:1.2;--font-display-te:Ramabhadra, "Noto Sans Telugu", sans-serif;--font-display-en:Fraunces, Georgia, serif;--font-body-te:"Noto Sans Telugu", "Noto Sans", sans-serif;--font-body-en:"Noto Sans", "Noto Sans Telugu", system-ui, sans-serif;--text-te-display-lg:400 32px/1.3 var(--font-display-te);--text-te-display:400 28px/1.3 var(--font-display-te);--text-te-title:600 20px/1.5 var(--font-body-te);--text-te-body:400 17px/1.6 var(--font-body-te);--text-te-label:500 15px/1.5 var(--font-body-te);--text-te-caption:400 14px/1.5 var(--font-body-te);--text-en-display-lg:600 32px/1.3 var(--font-display-en);--text-en-display:600 28px/1.3 var(--font-display-en);--text-en-title:600 19px/1.45 var(--font-body-en);--text-en-body:400 16px/1.6 var(--font-body-en);--text-en-label:500 14px/1.45 var(--font-body-en);--text-en-caption:400 13px/1.5 var(--font-body-en);--text-times:50 <html lang="en">
<head>
<meta charset="utf-8">
<title>AstroZ · New house</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="astroz-tokens.css">
<link rel="stylesheet" href="ds/astroz/components/bundle.css">
<script src="ds/astroz/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fff8ee}
a{color:#c8102e}a:hover{color:#9e0c24}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 100%; min-height: 1922px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--az-bg); color: var(--az-ink); font-family: var(--font-body-en);">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 0 8px;">
    <div style="display: flex; align-items: center; gap: 4px; min-width: 0;">
      <a href="Main.dc.html" aria-label="Back to wishes" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; color: var(--az-ink);"><span style="display: inline-flex; transform: rotate(180deg);"><x-import component-from-global-scope="AstroZ.Icon" name="chevron-right"></x-import></span></a>
      <div style="display: flex; flex-direction: column;">
        <h1 style="margin: 0; font-family: var(--font-display-en); font-weight: 600; font-size: 24px; line-height: 1.25;">New house</h1>
        <span style="font-size: 14px; color: var(--az-ink-muted); line-height: 1.4;">Gruhapravesam</span>
      </div>
    </div>
    <x-import component-from-global-scope="AstroZ.LangToggle" default-value="en"></x-import>
  </header>

  <main style="display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 32px; flex-grow: 1;">
    <fieldset class="az-card" style="margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <legend style="float: left; padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 600;">Which way does the main door face?</legend>
      <div style="clear: both; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <button type="button" aria-pressed="true" style="min-height: 48px; border-radius: 12px; border: 1.5px solid var(--az-kumkum); background: var(--az-kumkum-soft); color: var(--az-ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">East</button>
        <button type="button" aria-pressed="false" style="min-height: 48px; border-radius: 12px; border: 1.5px solid var(--az-line-strong); background: var(--az-surface); color: var(--az-ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">North</button>
        <button type="button" aria-pressed="false" style="min-height: 48px; border-radius: 12px; border: 1.5px solid var(--az-line-strong); background: var(--az-surface); color: var(--az-ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">West</button>
        <button type="button" aria-pressed="false" style="min-height: 48px; border-radius: 12px; border: 1.5px solid var(--az-line-strong); background: var(--az-surface); color: var(--az-ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">South</button>
      </div>
    </fieldset>

    <section class="az-card" style="padding: 20px; display: flex; gap: 16px; align-items: flex-start; border-color: var(--az-gold);">
      <div aria-hidden="true" style="flex: none; position: relative; width: 96px; height: 96px; border-radius: 50%; border: 1.5px solid var(--az-gold); background: var(--az-turmeric-soft);">
        <span style="position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--az-ink-muted);">N</span>
        <span style="position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--az-ink-muted);">S</span>
        <span style="position: absolute; left: 8px; top: 38px; font-size: 12px; font-weight: 600; color: var(--az-ink-muted);">W</span>
        <span style="position: absolute; right: 6px; top: 36px; padding: 0 5px; border-radius: 999px; background: var(--az-kumkum); color: var(--az-on-kumkum); font-size: 12px; font-weight: 700;">E</span>
        <span style="position: absolute; left: 32px; top: 32px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--az-kumkum-ink);"><x-import component-from-global-scope="AstroZ.Icon" name="house"></x-import></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
        <x-import component-from-global-scope="AstroZ.StatusChip" status="good" lang="en" label="Good for your house" style="align-self: flex-start;"></x-import>
        <h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4;">Enter from the east door</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.6;">Step in right foot first, facing the rising sun, with the kalasham in hand.</p>
        <button type="button" class="az-why" style="align-self: flex-start;">Why?</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 style="margin: 0; font-family: var(--font-display-en); font-weight: 600; font-size: 22px; line-height: 1.3;">Gruhapravesam dates</h2>
        <p style="margin: 0; font-size: 15px; color: var(--az-ink-muted); line-height: 1.5;">For Sravani and Kiran · Jan to Mar 2027</p>
      </div>
      <x-import component-from-global-scope="AstroZ.DateResultCard" lang="en" rank="{{r1.rank}}" date="5 Feb" weekday="Friday" tithi="Shukla Panchami" window="06:48 – 08:20" score="{{r1.score}}" status="good" reasons="{{r1.reasons}}" action="Add to calendar"></x-import>
      <x-import component-from-global-scope="AstroZ.DateResultCard" lang="en" rank="{{r2.rank}}" date="15 Feb" weekday="Monday" tithi="Shukla Dashami" window="05:48 – 06:40" score="{{r2.score}}" status="mixed" reasons="{{r2.reasons}}"></x-import>
    </section>

    <div class="az-card">
      <x-import component-from-global-scope="AstroZ.TodoList" lang="en" id="house-todos" title="Ceremony checklist" items="{{todos}}"></x-import>
    </div>

    <x-import component-from-global-scope="AstroZ.Button" variant="primary" lang="en" icon="calendar" block="{{yes}}">Set a reminder for 5 Feb</x-import>
  </main>

  <div style="margin-top: auto;">
    <x-import component-from-global-scope="AstroZ.BottomNav" active="wishes" lang="en"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"elder":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1922}}'>
class Component extends DCLogic {
  renderVals() {
    const cls = ['az', 'az-en'];
    if (this.props.elder) cls.push('az-elder');
    if (this.props.dark) cls.push('az-dark');
    return {
      rootClass: cls.join(' '),
      yes: true,
      r1: { rank: 1, score: 90, reasons: ['Magha masam — favoured for gruhapravesam', 'Sthira lagna at the moment of entry', 'Clear of Rahu kalam and varjyam'] },
      r2: { rank: 2, score: 74, reasons: ['Rohini nakshatram suits a new home', { text: 'Early start — before sunrise', status: 'mixed' }] },
      todos: [
        { text: 'Keep the entry swept and lit the evening before', when: '4 Feb, after sunset' },
        { text: 'Hang a mango-leaf thoranam over the main door', when: 'Morning of' },
        { text: 'Carry a kalasham with water and mango leaves in', when: '06:48 – 08:20' },
        { text: 'Boil milk until it overflows, on the east side of the stove', when: 'Right after entry' },
        { text: 'Invite elders in first for their blessings' }
      ]
    };
  }
}
</script>
</body>
  </html>
