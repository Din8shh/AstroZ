<html lang="te">
<head>

<x-dc>
<helmet>
<style>
body{margin:0;background:#fff8ee}
a{color:#c8102e}a:hover{color:#9e0c24}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 100%; height: 844px; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: var(--az-bg); color: var(--az-ink); font-family: var(--font-body-te);">
<div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 0 8px; border-top: 2px solid var(--az-gold);"><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span><span style="display: inline-flex; color: var(--az-thoranam);"><x-import component-from-global-scope="AstroZ.Icon" name="thoranam" size="{{th}}"></x-import></span></div>
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 40px 20px 0;">
  <div style="align-self: center;"><x-import component-from-global-scope="AstroZ.Muggulu" size="{{mugL}}"></x-import></div>
  <div style="display: flex; flex-direction: column; gap: 8px; text-align: center;">
    <h1 style="margin: 0; font-family: var(--font-display-te); font-weight: 400; font-size: 32px; line-height: 1.35;">మీ భాష ఎంచుకోండి</h1>
    <p style="margin: 0; font-family: var(--font-display-en); font-weight: 600; font-size: 22px; line-height: 1.3;">Choose your language</p>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--az-ink-muted);">తర్వాత ఎప్పుడైనా పైన ఉన్న తె / EN తో మార్చుకోవచ్చు.</p>
  </div>
  <div role="group" aria-label="భాష / Language" style="display: flex; flex-direction: column; gap: 12px;">
    <button type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 88px; padding: 16px 20px; border-radius: 16px; border: 2px solid var(--az-kumkum); background: var(--az-kumkum-soft); color: var(--az-ink); text-align: left; cursor: pointer;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: var(--font-display-te); font-size: 26px; line-height: 1.4;">తెలుగు</span><span style="font-family: var(--font-body-te); font-size: 15px; line-height: 1.5; color: var(--az-ink-muted);">అన్నీ తెలుగులో</span></span><span style="display: inline-flex; color: var(--az-kumkum-ink);"><x-import component-from-global-scope="AstroZ.Icon" name="check"></x-import></span></button>
    <button type="button" aria-pressed="false" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 88px; padding: 16px 20px; border-radius: 16px; border: 1.5px solid var(--az-line-strong); background: var(--az-surface); color: var(--az-ink); text-align: left; cursor: pointer;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: var(--font-display-en); font-size: 26px; line-height: 1.4;">English</span><span style="font-family: var(--font-body-te); font-size: 15px; line-height: 1.5; color: var(--az-ink-muted);">Telugu terms kept as they are</span></span><span style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--az-line-strong);"></span></button>
  </div>
</main>
<footer style="padding: 16px 20px 32px;"><x-import component-from-global-scope="AstroZ.Button" variant="primary" block="{{yes}}">కొనసాగించండి</x-import></footer>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"elder":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cls = ['az', 'az-te'];
    if (this.props.dark) cls.push('az-dark');
    if (this.props.elder) cls.push('az-elder');
    const V = {"th": 28, "mugL": 72};
    return Object.assign({ rootClass: cls.join(' '), yes: true }, V);
  }
}
</script>
